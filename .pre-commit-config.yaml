repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The type check and the fast tests (C2): those that process no demo data, under a second.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: fast-tests
        name: fast tests
        entry: >-
          uv run pytest -q -p no:cacheprovider tests/test_scope.py tests/test_answer.py
          tests/test_prompts.py tests/test_given.py tests/test_logs.py tests/test_properties.py
          tests/test_trace.py tests/test_examples.py
        language: system
        pass_filenames: false
        types: [python]
