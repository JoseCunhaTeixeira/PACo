# AMD GPUs (ROCm), such as the Radeon RX 9000 and 7900 series: vLLM's ROCm image and AMD's device
# access, over compose.yaml.
#
#   docker compose -f compose.yaml -f compose.rocm.yaml up -d vllm paco-server
#
# vLLM's 4-bit formats (AWQ, GPTQ) do not run on AMD GPUs: Qwen/Qwen3-14B-FP8 runs in FP8, on a
# 24 GB card.

services:
  vllm:
    image: vllm/vllm-openai-rocm:v0.30.0
    deploy: !reset {}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    # The models this machine already downloaded (hf download ...), instead of a Docker volume.
    volumes: !override
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
