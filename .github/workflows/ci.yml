# The same checks as before a commit: lint, format, types, tests, sigpipe installed from GitHub at
# the commit uv.lock pins. The tests that read real lines (PAC's local active_p2 and passive_p2,
# kept in no repository) are skipped here: run them where those lines are (README, Develop).
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tag (v10) since v8: pin the release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.9"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra petro
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Types
        run: uv run pyright src tests
      - name: Tests
        run: uv run pytest
