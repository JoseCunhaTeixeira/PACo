# PACo's whole stack on a GPU host: vLLM serving your model, PACo's MCP server, and the agent.
#
#   docker compose up -d vllm paco-server   # the first start downloads the model
#   docker compose run --rm agent           # chat in this terminal; approvals are asked here
#   docker compose run --rm evaluate        # the evaluation suite
#
# Needs NVIDIA's container toolkit on the host and a GPU the model fits on. Settings come from
# .env: PACO_LLM_MODEL, the model vLLM serves; VLLM_PARSERS, its family's parsers
# ("--tool-call-parser=<parser>", and "--reasoning-parser=<parser>" for a model that thinks: vLLM's
# docs list them); PACO_LLM_CONTEXT, PACO_WORKERS, and HF_TOKEN for gated models. Profiles are read from <PACO_DATA_DIR>/input, results written to <PACO_DATA_DIR>/output:
# PAC's data folder by default (../PAC/data), PACo's repository holding no data.

x-model: &model
  PACO_LLM_BASE_URL: http://vllm:8000/v1
  PACO_LLM_MODEL: ${PACO_LLM_MODEL:?set PACO_LLM_MODEL in .env}
  PACO_LLM_CONTEXT: ${PACO_LLM_CONTEXT:-16384}

services:
  vllm:
    image: vllm/vllm-openai:v0.30.0
    # The model; the context the agent reads too, one setting for both; few conversations at once,
    # which leaves the GPU's memory to the context (PACo serves one user, vLLM's default prepares
    # for 512); the model's tool calls, read by its family's parsers.
    command: >-
      --model=${PACO_LLM_MODEL:?set PACO_LLM_MODEL in .env}
      --max-model-len=${PACO_LLM_CONTEXT:-16384}
      --max-num-seqs=${VLLM_MAX_NUM_SEQS:-8}
      --enable-auto-tool-choice
      ${VLLM_PARSERS:?set VLLM_PARSERS in .env: the tool-call parser of your model's family}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - 127.0.0.1:8001:8000  # this machine only
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      start_period: 10m  # downloading and loading the model

  paco-server:
    build: .
    image: paco
    environment:
      PACO_WORKERS: ${PACO_WORKERS:-4}
      # Listening on 0.0.0.0 in the container: check the Host header against DNS rebinding.
      PACO_ALLOWED_HOSTS: '["paco-server:*", "127.0.0.1:*", "localhost:*"]'
    volumes:
      - ${PACO_DATA_DIR:-../PAC/data}:/data
    ports:
      - 127.0.0.1:8000:8000  # this machine only: anyone who reaches it can run PACo's tools

  agent:
    image: paco
    command: paco-agent
    environment:
      <<: *model
      PACO_MCP_URL: http://paco-server:8000/mcp
    volumes:
      - ${PACO_DATA_DIR:-../PAC/data}:/data
    stdin_open: true
    tty: true
    depends_on:
      vllm:
        condition: service_healthy
      paco-server:
        condition: service_started
    profiles: [tools]

  evaluate:
    image: paco
    command: paco-evaluate
    environment:
      <<: *model
      PACO_WORKERS: ${PACO_WORKERS:-4}
    volumes:
      - ${PACO_DATA_DIR:-../PAC/data}:/data
    depends_on:
      vllm:
        condition: service_healthy
    profiles: [tools]

volumes:
  huggingface:
